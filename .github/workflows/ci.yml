---
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The action installs the linter but does not run it: `make lint` does,
      # so the gate CI applies is the one a developer gets locally, gofmt and
      # go vet included.
      #
      # golangci-lint refuses to run when the Go version it was built with is
      # older than the module's. The v6 action installs the v1 line, which is
      # built with go1.24 and therefore cannot lint a go1.26 module at all.
      # The version is pinned rather than floating so CI and local runs agree
      # on which linters exist.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Lint
        run: make lint

      - name: Test
        run: make test
