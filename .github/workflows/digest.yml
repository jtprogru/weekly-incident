---
name: digest

# Monday morning, after the day's collect. The default week is the one that
# just closed, so the digest always covers a full Monday-to-Sunday span.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week to render, e.g. 2026-W34 (default: the week that just closed)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # No network access here: the digest is built entirely from the archive,
      # so it can be regenerated for any past week with a changed threshold.
      #
      # The week comes from the command's stdout, not from the filesystem.
      # Guessing it with `ls | tail -1` picked the newest directory on disk,
      # which is the wrong week whenever an older one is rendered on purpose.
      - name: Render the week
        id: render
        run: |
          set -euo pipefail
          week="$(go run ./cmd/digest ${{ inputs.week && format('-week {0}', inputs.week) || '' }})"
          echo "week=${week}" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<SUMMARY_EOF'
            cat "weeks/${week}/summary.txt"
            echo 'SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Commit the week
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add weeks data
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m "docs(weeks): digest for ${{ steps.render.outputs.week }}"
          git push

      - name: Notify
        if: always()
        uses: jtprogru/notiflow@v2
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ job.status }}
          # The summary carries dots, parens and a URL; MarkdownV2 would reject it.
          parse_mode: none
          message: |
            ${{ steps.render.outputs.summary }}

            https://github.com/${{ github.repository }}/blob/main/weeks/${{ steps.render.outputs.week }}/digest.md
