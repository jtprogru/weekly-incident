---
name: collect

# Daily, not weekly. Vendor feeds hold a fixed number of incidents with no
# pagination — 50, which is only about 20 days for Cloudflare — so a weekly
# cadence would leave just two missed runs of slack before data is lost for
# good. The daily commit doubles as the activity that keeps GitHub from
# disabling the schedule after 60 idle days.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Collect and publish
        id: collect
        run: bash scripts/collect-publish.sh

      - name: Notify on failure
        if: failure()
        uses: jtprogru/notiflow@v2
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure

      - name: Notify on archive gap
        if: success() && steps.collect.outputs.warning != ''
        uses: jtprogru/notiflow@v2
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: success
          notify_on: success
          parse_mode: HTML
          message: |
            <b>Archive gap — history may already be lost</b>

            ${{ steps.collect.outputs.warning }}

            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Run log</a>
